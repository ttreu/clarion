[project]
name = "clarion"
version = "0.1.1"
description = "clarion: clean up speech from field recorders and cameras, including readings with accompanying music (AI denoising for the voice, gentle noise reduction for the music)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Thomas Treu" }]
keywords = ["audio", "restoration", "noise reduction", "speech enhancement", "field recording", "camera audio", "reading", "deepfilternet"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Intended Audience :: End Users/Desktop",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "noisereduce>=3.0",
    "nara-wpe>=0.0.9",
    # <6.12: the 6.12 wheels contain bindings built for macOS 26 (6.11: 15); keeps the downloadable app
    # on the safe side for older macOS. numpy/scipy need macOS 14 anyway.
    "PySide6>=6.6,<6.12",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
clarion-cli = "clarion.cli:main"

[project.gui-scripts]
clarion = "clarion.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clarion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the deep-filter binary and network on first run"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]
